# Builds the Windows VST3 (and Standalone) with MSVC on GitHub's Windows runners.
# Results: Actions -> latest "Build" run -> Artifacts, and (for pushes to main) the zips are
# also committed to the `builds` branch so they can be fetched with plain git.
name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (downloads JUCE)
        run: cmake -S . -B build -A x64 -DPILLOW_FORMATS="VST3;Standalone"

      - name: Build
        run: cmake --build build --config Release --parallel --target PillowSaturator_VST3 PillowSaturator_Standalone PillowEngineTests

      - name: Engine tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: PillowSaturator-Windows-VST3
          path: build/PillowSaturator_artefacts/Release/VST3/
          if-no-files-found: error

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: PillowSaturator-Windows-Standalone
          path: build/PillowSaturator_artefacts/Release/Standalone/
          if-no-files-found: error

      - name: Publish zips to the 'builds' branch
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "publish"
          New-Item -ItemType Directory -Force $out | Out-Null
          Compress-Archive -Path "build/PillowSaturator_artefacts/Release/VST3/*" -DestinationPath "$out/PillowSaturator-Windows-VST3.zip" -Force
          Compress-Archive -Path "build/PillowSaturator_artefacts/Release/Standalone/*" -DestinationPath "$out/PillowSaturator-Windows-Standalone.zip" -Force
          Set-Location $out
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Windows build of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
